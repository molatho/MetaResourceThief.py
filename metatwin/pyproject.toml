[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatwin"
version = "0.1.0"
description = "Clone a source PE's resources, signature and timestamps onto a target"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["resourcehacker", "sigthief"]

[project.optional-dependencies]
dev = ["pytest>=7", "pefile>=2021.9.3"]

[project.scripts]
metatwin = "metatwin.cli:main"

[tool.setuptools]
packages = ["metatwin"]

[tool.setuptools.package-data]
metatwin = ["NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
